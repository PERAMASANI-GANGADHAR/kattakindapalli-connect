<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <title>Kattakindapalli Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Language Selection (English/Telugu) -->
    <div id="google_translate_element" style="display:none;"></div>
    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          { pageLanguage: 'te', includedLanguages: 'en,te', autoDisplay: false },
          'google_translate_element'
        );
      }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script>
      // Google banner ని బలవంతంగా దాచడానికి
      const hideGoogleBanner = () => {
        document.body.style.top = '0px';
        const frame = document.querySelector('iframe.goog-te-banner-frame');
        if (frame) frame.style.display = 'none';
      };
      const observer = new MutationObserver(hideGoogleBanner);
      observer.observe(document.body, { childList: true, subtree: true, attributes: true });
      setInterval(hideGoogleBanner, 500);
    </script>
  </body>
</html>
